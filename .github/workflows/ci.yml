name: Quality checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Content, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate content registry
        run: bun run validate:content

      - name: Lint changed source files
        shell: bash
        run: |
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "origin/${{ github.base_ref }}...HEAD" -- '*.ts' '*.tsx')
          if ((${#files[@]})); then
            bunx eslint "${files[@]}" --rule 'prettier/prettier: off'
          fi

      - name: Build production bundle
        run: bun run build

      - name: Check build output
        run: |
          echo "Build output:"
          ls -la .output
