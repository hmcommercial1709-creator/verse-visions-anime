name: Quality checks

on:
  # Also on push to main. Eight TypeScript errors sat broken on main for weeks
  # because this workflow only ran on pull_request, and pushes to main trigger
  # Deploy alone - so nothing typechecked main until someone opened a PR.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Content, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check language navigation and rewards
        run: node scripts/check-interaction-regressions.mjs

      - name: Verify Offerwall policy preserves consent
        run: node scripts/check-offerwall-policy.mjs

      - name: Reject weak or duplicate generated content
        run: node scripts/check-content-quality.mjs

      # Guards the Taste Card: the card may state only what the picks support,
      # and the floating button must take itself out of the way of every ad box
      # in the strip it occupies. An accidental click caused by our own overlay
      # is an AdSense violation against the account, not just the placement.
      - name: Check the Taste Card and its ad-safety rule
        run: node scripts/check-taste-card.mjs

      # Guards the engagement features. The load-bearing one is the quiz:
      # it scores against the personality traits our editors wrote in
      # characters.ts, so a trait invented for a nice-sounding answer would
      # score against nothing and skew every result. Also checks related
      # merchandise never borrows another franchise's products, the watchlist
      # survives any value in localStorage, and shared list URLs stay out of
      # the index.
      - name: Check the engagement features and the quiz's data honesty
        run: npx tsx scripts/check-engagement.mjs

      # Guards the Mission Loadout. The load-bearing rules: every mood's
      # genres must exist in the anime data, every bundle slot must be
      # genuinely related to what it sits beside or be honestly empty, poll
      # shares must sum to 100 and never claim a scope they do not have, and
      # sound must stay opt-in.
      - name: Check the matchmaker's pairings and the poll's honesty
        run: npx tsx scripts/check-matchmaker.mjs

      # Guards the Pinterest integration. The script it replaced reported
      # success on every deploy while posting nothing: no API call, a sitemap
      # parse that matched zero elements, and a bare except that swallowed
      # every failure. These check that a failure is now VISIBLE.
      - name: Check the Pinterest integration cannot fail silently
        run: npx tsx scripts/check-pinterest.mjs

      # Guards the rule that a trend score is measured, not assumed. Someone
      # "fixing" the nulls by defaulting a missing baseline to zero turns every
      # brand-new term into infinite growth; this fails the build instead.
      - name: Check the trend pipeline's invariants
        run: node scripts/check-trends.mjs

      # Guards the winner-amplification logic: first-run deltas stay null, the
      # queue stays ordered by clicks available rather than by position, and
      # comparison windows stay equal-length and behind the Search Analytics lag.
      - name: Check the Search Console feedback logic
        run: node scripts/check-gsc.mjs

      # Guards the rule the whole opportunity model rests on: a factor with no
      # evidence is dropped, never defaulted. One silent default turns every
      # score into part fiction with no way to tell which part.
      - name: Check the growth engine's invariants
        run: node scripts/check-growth.mjs

      # Renders every sitemap from source and validates it before deploy,
      # rather than after Search Console reports it.
      - name: Validate sitemap XML, lastmod and the index
        run: npx tsx scripts/check-sitemap-xml.mjs

      - name: Validate content registry
        run: bun run scripts/validate-content.ts

      - name: Lint changed source files
        shell: bash
        run: |
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || 'HEAD~1' }}" -- '*.ts' '*.tsx')
          if ((${#files[@]})); then
            bunx eslint "${files[@]}" --rule 'prettier/prettier: off'
          fi

      - name: Build production bundle
        run: bun run build

      - name: Check TypeScript after route generation
        run: bunx tsc --noEmit

      - name: Check Harbor Island rules
        run: node scripts/check-harbor.mjs

      - name: Check build output
        run: |
          node scripts/check-build-output.mjs
          node scripts/check-video-feed.mjs
          

