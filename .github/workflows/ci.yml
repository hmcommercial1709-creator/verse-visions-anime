name: Quality checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Content, lint and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check language navigation and rewards
        run: node scripts/check-interaction-regressions.mjs

      - name: Verify Offerwall policy preserves consent
        run: node scripts/check-offerwall-policy.mjs

      - name: Reject weak or duplicate generated content
        run: node scripts/check-content-quality.mjs

      - name: Validate content registry
        run: bun run scripts/validate-content.ts

      - name: Lint changed source files
        shell: bash
        run: |
          mapfile -d '' files < <(git diff --name-only --diff-filter=ACMR -z "${{ github.event_name == 'pull_request' && format('origin/{0}...HEAD', github.base_ref) || 'HEAD~1' }}" -- '*.ts' '*.tsx')
          if ((${#files[@]})); then
            bunx eslint "${files[@]}" --rule 'prettier/prettier: off'
          fi

      - name: Build production bundle
        run: bun run build

      - name: Check TypeScript after route generation
        run: bunx tsc --noEmit

      - name: Check Harbor Island rules
        run: node scripts/check-harbor.mjs

      - name: Check build output
        run: |
          node scripts/check-build-output.mjs
          node scripts/check-video-feed.mjs
          

