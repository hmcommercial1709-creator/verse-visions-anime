name: Deploy

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund
          pip install requests

      # Two steps stood here and they were the site's biggest indexing problem.
      #
      # master-neural-core.mjs wrote 50,000 rows to game_nexus_matrix and
      # master-anime-core.mjs wrote 31,250 to anime_nexus_matrix, on EVERY
      # deploy. Nothing about those rows was real: the slug was
      # `omni-us-supreme-node-<n>`, the title was "GameCastle Absolute
      # Universal Nexus Node #<n>", aggregate_rating was `4.8 + (id % 3) *
      # 0.05`, reviews_count was `5000 + (id * 37) % 150000`, and the review
      # text cycled through four hardcoded sentences — so one sentence
      # appeared, word for word, on 12,500 pages.
      #
      # Each row became a URL of about forty words, half of them fabricated.
      # That is scaled content abuse under Google's spam policies, and the
      # symptom is precisely what Search Console reported for a month:
      # 81,250 URLs sitting in "Discovered - currently not indexed" while the
      # 1,039 real pages waited behind them for crawl budget.
      #
      # Removed rather than disabled. A commented-out step is one edit away
      # from running again, and this one cost weeks.

      - name: Build project
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Check language navigation and rewards
        run: node scripts/check-interaction-regressions.mjs

      - name: Verify Offerwall policy preserves consent
        run: node scripts/check-offerwall-policy.mjs

      - name: Reject weak or duplicate generated content
        run: node scripts/check-content-quality.mjs

      # Guards the Taste Card: the card may state only what the picks support,
      # and the floating button must take itself out of the way of every ad box
      # in the strip it occupies. An accidental click caused by our own overlay
      # is an AdSense violation against the account, not just the placement.
      - name: Check the Taste Card and its ad-safety rule
        run: node scripts/check-taste-card.mjs

      # Guards the engagement features. The load-bearing one is the quiz:
      # it scores against the personality traits our editors wrote in
      # characters.ts, so a trait invented for a nice-sounding answer would
      # score against nothing and skew every result. Also checks related
      # merchandise never borrows another franchise's products, the watchlist
      # survives any value in localStorage, and shared list URLs stay out of
      # the index.
      - name: Check the engagement features and the quiz's data honesty
        run: npx tsx scripts/check-engagement.mjs

      - name: Run Pinterest Auto Poster
        run: python scripts/pinterest-auto-poster.py

      - name: Check video feed and live channels
        run: node scripts/check-video-feed.mjs

      - name: Verify Cloudflare deployable output
        run: node scripts/check-build-output.mjs
