name: Deploy

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Run Google Indexing Script and Sitemap Ping
        run: |
          echo "Triggering continuous indexing refresh and sitemap ping..."
          npx ts-node scripts/google-indexing.ts || node scripts/google-indexing.ts || true
          curl -s "https://www.google.com/ping?sitemap=https://gamecastle.store/sitemap.xml" || true

      - name: Verify output folder
        run: |
          if [ -d ".output" ]; then
            echo "Found .output folder successfully."
          else
            echo "Error: .output folder not found!"
            exit 1
          fi
