name: Deploy

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          pip install requests

      - name: Build project
        run: npm run build

      - name: Check language navigation and rewards
        run: node scripts/check-interaction-regressions.mjs

      - name: Verify Offerwall policy preserves consent
        run: node scripts/check-offerwall-policy.mjs

      - name: Verify published sitemap health
        run: node scripts/check-sitemaps.mjs

      - name: Reject weak or duplicate generated content
        run: node scripts/check-content-quality.mjs

      - name: Run Pinterest Auto Poster
        run: python scripts/pinterest-auto-poster.py

      - name: Verify output folder
        run: |
          if [ -d ".output" ]; then
            echo "Found .output folder successfully."
          else
            echo "Error: .output folder not found!"
            exit 1
          fi
