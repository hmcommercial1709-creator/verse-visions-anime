name: Deploy

on:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          pip install requests

      - name: Install Supabase client dependency
        run: npm install @supabase/supabase-js

      - name: Run Master Neural Core Automation
        run: node scripts/master-neural-core.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run Master Anime Core Automation
        run: node scripts/master-anime-core.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Build project
        run: npm run build

      - name: Check language navigation and rewards
        run: node scripts/check-interaction-regressions.mjs

      - name: Verify Offerwall policy preserves consent
        run: node scripts/check-offerwall-policy.mjs

      - name: Verify published sitemap health
        run: node scripts/check-sitemaps.mjs

      - name: Reject weak or duplicate generated content
        run: node scripts/check-content-quality.mjs

      - name: Run Pinterest Auto Poster
        run: python scripts/pinterest-auto-poster.py

      - name: Check video feed and live channels
        run: node scripts/check-video-feed.mjs

      - name: Verify Cloudflare deployable output
        run: node scripts/check-build-output.mjs
