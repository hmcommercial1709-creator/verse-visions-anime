name: Pinterest

# Separate from Deploy on purpose. Posting to a social account is not part of
# shipping the site, and while the two shared a job a Pinterest failure could
# only ever be swallowed or block a release. On its own it is free to fail
# loudly and be retried without touching anything else.

on:
  # The immediate test post runs from here: Actions -> Pinterest -> Run workflow.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the payloads without posting (needs no credentials)"
        type: boolean
        default: true
      limit:
        description: "Maximum pins to create in this run"
        type: string
        default: "3"
  schedule:
    # Once a day. The script skips anything already on the board, so a run with
    # nothing new to say posts nothing rather than reposting.
    - cron: "17 9 * * *"

permissions:
  contents: read

concurrency:
  # Never two runs at once: both would read the same board state, both would
  # decide the same page is unpinned, and the board would get duplicates.
  group: pinterest
  cancel-in-progress: false

jobs:
  publish:
    name: Publish pinnable pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Built from the site's own TypeScript data, so titles and descriptions
      # are the editorial ones. Exits non-zero when nothing is pinnable, which
      # is the state worth knowing about.
      - name: Build the pinnable queue
        run: npx tsx scripts/build-pinterest-queue.mjs

      - name: Publish to Pinterest
        env:
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_BOARD_ID: ${{ secrets.PINTEREST_BOARD_ID }}
        run: |
          python scripts/pinterest-auto-poster.py \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }} \
            --limit "${{ inputs.limit || '3' }}"
