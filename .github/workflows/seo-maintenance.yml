name: SEO and AI maintenance

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seo-maintenance
  cancel-in-progress: true

jobs:
  # Runs first and on its own: it only fetches the live site, so it needs
  # neither a build nor node_modules. The build used to run ahead of it in the
  # same job, which meant a broken build stopped the live sitemaps from being
  # checked at all — they went unchecked for days while Search Console was
  # reporting an error on one of them.
  sitemaps:
    name: Validate live sitemaps and the pages they advertise
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://gamecastle.store' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate partitioned XML sitemaps and sampled pages
        run: node scripts/check-sitemaps.mjs

  validate:
    name: Validate SEO, AI manifests and cross-links
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://gamecastle.store' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build dynamic route matrix
        run: npm run build

      - name: Validate AI-ready manifests and edge caching
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/check-seo-endpoints.mjs

      - name: Verify internal navigation and cross-linking
        run: node scripts/check-interaction-regressions.mjs

      - name: Submit sitemap index to Google Search Console
        env:
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
        run: node scripts/ping-gsc.js
  # ---------------------------------------------------------------- catalog
  #
  # The catalog ingest runs here rather than on a developer's machine, because
  # this is where the network actually is: the sandbox these scripts were
  # written in denies graphql.anilist.co and store.steampowered.com outright,
  # so CI is the first place they can reach a live API at all.
  #
  # Separate concurrency group with cancel-in-progress off. The group above
  # cancels its predecessor, which is right for a check and wrong for an
  # ingest: cancelling a Steam run mid-flight loses up to an hour of
  # rate-limited lookups and, worse, loses the resume cursor for that stretch.
  ingest:
    name: Ingest the catalog (AniList, then Steam)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: catalog-ingest
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # DDL needs a Postgres connection; the service role key only reaches
      # PostgREST. So this step is opt-in: add a SUPABASE_DB_URL secret (the
      # connection string from Supabase → Settings → Database) and the schema
      # keeps itself current. Without it the step says exactly what to paste
      # where, and the ingest below refuses to write rather than silently
      # producing rows with no extras.
      - name: Apply pending migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL is not set — skipping automatic migration. The ingest below will refuse to write until the schema is current."
            echo "Apply these in the Supabase SQL editor, in order:"
            echo "  supabase/migrations/20260913120000_entities_metadata_jsonb.sql"
            echo "  supabase/migrations/20260913160000_catalog_matrix_public_read.sql"
            echo "Or add the SUPABASE_DB_URL secret to have this step do it every run."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          # Deliberately NOT a loop over supabase/migrations/*.sql.
          #
          # Most of the files in that directory are not safe to re-apply:
          # 20260901204040 does a bare CREATE POLICY (Postgres has no IF NOT
          # EXISTS for policies, so a second run errors), and 20260902000737
          # creates archive tables with CREATE TABLE ... AS and then DELETEs
          # the rows it copied — running that twice against a live database
          # would archive an empty set and delete nothing, or fail outright.
          # A nightly job must never be the thing that discovers that.
          #
          # This applies only the migrations the ingest below depends on, each
          # written to be idempotent: ADD COLUMN IF NOT EXISTS, GRANTs, CREATE
          # INDEX IF NOT EXISTS, and a DROP POLICY before the CREATE POLICY
          # (Postgres has no IF NOT EXISTS for policies). ON_ERROR_STOP turns
          # any surprise into a failed job rather than a half-migrated schema.
          for file in \
            supabase/migrations/20260913120000_entities_metadata_jsonb.sql \
            supabase/migrations/20260913160000_catalog_matrix_public_read.sql
          do
            echo "--- applying $file"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      # Fast: GraphQL returns 50 titles with their studios, tags, relations and
      # characters per request, so a full pass is minutes.
      # No --require-metadata here. Without the column the run still imports
      # every row with its name, description, image, categories and source —
      # the quality level the catalog had before the extras existed — and
      # emits a ::warning:: naming what was skipped. Refusing outright left
      # the catalog empty, which is strictly worse than a catalog without the
      # derived facts, and it stopped the pipeline dead on a prerequisite that
      # only affects the extras.
      - name: Ingest anime from AniList
        run: npm run ingest:anilist -- --limit=5000

      # Slow by nature: Steam's appdetails is one app per request, throttled to
      # roughly 200 per five minutes. --resume continues from the appid the
      # last run reached, so the 100,000-app list accumulates a few hundred
      # games a night instead of being attempted in one impossible pass.
      # The limit is sized to finish inside this job's timeout.
      # Manga is a separate entity type with no overlap against anime, so it
      # is real catalog growth rather than a second page for titles already
      # held. Jikan leads (25 entries with genres, authors and serializations
      # per request) and Kitsu supplements what its ranked list does not
      # reach; both feed one cross-source dedupe.
      - name: Ingest manga from Jikan and Kitsu
        continue-on-error: true
        run: npm run ingest:manga -- --limit=3000

      # continue-on-error because the sources are independent and Steam is the
      # flakiest: its app-list method is gone entirely and the store search is
      # an undocumented endpoint. An earlier run imported 5,000 anime rows
      # successfully and was then reported as a failure because Steam answered
      # 404 — which reads as "the ingest is broken" when it had just done its
      # job. A Steam outage shows as a warning annotation instead.
      #
      # No --resume: the script now skips every appid already in the table, so
      # each night reaches further into the store on its own. appdetails at
      # ~200 requests per five minutes is what sizes the limit, not discovery.
      - name: Ingest games from Steam
        continue-on-error: true
        run: npm run ingest:steam -- --limit=400

      - name: Verify the catalog after ingest
        run: npm run verify:catalog -- --read-only
